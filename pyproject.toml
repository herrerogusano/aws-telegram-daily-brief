[project]
name = "aws-telegram-daily-brief"
version = "0.1.0"
description = "Scheduled, safe AWS account briefs for Telegram."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.52",
    "httpx>=0.28.1",
    "tzdata>=2025.2",
]

[project.scripts]
telegram-test = "aws_telegram_daily_brief.notifications.telegram_test:main"
daily-report = "aws_telegram_daily_brief.reporting.daily_report_cli:main"
daily-brief = "aws_telegram_daily_brief.reporting.daily_brief_cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.1.1",
    "ruff>=0.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

