AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Bounded daily AWS inventory brief with controlled Telegram delivery
Resources:
  DailyBriefLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/aws-telegram-daily-brief
      RetentionInDays: 14
  DailyBriefFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: aws-telegram-daily-brief
      CodeUri: src/
      Handler: aws_telegram_daily_brief.handler.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      Timeout: 60
      MemorySize: 256
      Policies:
        - Statement:
            - Effect: Allow
              Action: [lambda:ListFunctions]
              Resource: '*'
            - Effect: Allow
              Action: [ec2:DescribeInstances, ec2:DescribeVpcs, ec2:DescribeSubnets, ec2:DescribeRouteTables, ec2:DescribeInternetGateways]
              Resource: '*'
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: arn:aws:bedrock:eu-west-1::foundation-model/amazon.nova-micro-v1:0
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/telegram-daily-brief/telegram/config
            - Effect: Allow
              Action: [logs:CreateLogStream, logs:PutLogEvents]
              Resource: !GetAtt DailyBriefLogGroup.Arn
      Environment:
        Variables:
          AWS_REPORT_REGION: eu-west-1
          BEDROCK_ENABLED: 'false'
          BEDROCK_REGION: eu-west-1
          BEDROCK_MAX_OUTPUT_TOKENS: '250'
          BEDROCK_TIMEOUT_SECONDS: '15'
          TELEGRAM_TIMEOUT_SECONDS: '10'
          REPORT_LANGUAGE: es
          LOG_LEVEL: INFO
          TELEGRAM_ENABLED: 'true'
          TELEGRAM_CONFIG_PARAMETER_NAME: /telegram-daily-brief/telegram/config
      Events:
        DailyMorningSchedule:
          Type: ScheduleV2
          Properties:
            Name: aws-telegram-daily-brief-morning
            ScheduleExpression: cron(0 9 * * ? *)
            ScheduleExpressionTimezone: Europe/Madrid
            State: ENABLED
            FlexibleTimeWindow:
              Mode: "OFF"
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 3600
            Input: '{"source":"eventbridge-scheduler","mode":"daily"}'
