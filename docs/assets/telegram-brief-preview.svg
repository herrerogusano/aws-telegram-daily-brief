<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic AWS daily brief delivered in a chat interface</title>
  <desc id="desc">A dark blue chat window containing a bounded AWS inventory summary with synthetic values.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b132b"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="960" height="520" rx="28" fill="url(#background)"/>
  <circle cx="73" cy="70" r="30" fill="#38bdf8"/>
  <path d="M57 70l31-13-8 28-9-8-7 6 1-11z" fill="#ffffff" opacity="0.95"/>
  <text x="120" y="63" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="700">AWS Daily Brief</text>
  <text x="120" y="88" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="15">Scheduled serverless report · 09:00 Europe/Madrid</text>
  <rect x="54" y="123" width="852" height="334" rx="22" fill="#f8fafc" filter="url(#shadow)"/>
  <text x="91" y="169" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="20" font-weight="700">AWS Daily Brief — 26 Aug 2026</text>
  <rect x="91" y="191" width="110" height="32" rx="16" fill="#dcfce7"/>
  <circle cx="111" cy="207" r="6" fill="#16a34a"/>
  <text x="126" y="213" fill="#166534" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">STATUS OK</text>
  <line x1="91" y1="247" x2="869" y2="247" stroke="#e2e8f0"/>
  <text x="91" y="286" fill="#475569" font-family="Inter,Segoe UI,sans-serif" font-size="17">Resources detected</text>
  <text x="840" y="286" text-anchor="end" fill="#0f172a" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">3</text>
  <text x="91" y="324" fill="#475569" font-family="Inter,Segoe UI,sans-serif" font-size="17">Services checked</text>
  <text x="840" y="324" text-anchor="end" fill="#0f172a" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">2</text>
  <text x="91" y="362" fill="#475569" font-family="Inter,Segoe UI,sans-serif" font-size="17">Lambda</text>
  <text x="840" y="362" text-anchor="end" fill="#0f172a" font-family="Inter,Segoe UI,sans-serif" font-size="17">1 function</text>
  <text x="91" y="400" fill="#475569" font-family="Inter,Segoe UI,sans-serif" font-size="17">EC2 networking</text>
  <text x="840" y="400" text-anchor="end" fill="#0f172a" font-family="Inter,Segoe UI,sans-serif" font-size="17">1 VPC · 1 subnet</text>
  <text x="91" y="438" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="15">No critical collection errors detected · deterministic summary</text>
  <text x="906" y="493" text-anchor="end" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13">SYNTHETIC PREVIEW</text>
</svg>
